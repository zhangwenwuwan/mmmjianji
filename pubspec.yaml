name: jianji
description: "简记 —— 本地优先的个人记账应用"
publish_to: 'none'
version: 1.4.65+109

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.3.2
  share_plus: ^10.1.4
  intl: any
  image_picker: ^1.2.4
  local_auth: ^2.3.0
  file_picker: ^11.0.3
  flutter_local_notifications: ^22.3.2
  path_provider: ^2.1.6
  timezone: ^0.11.2
  # 离线中文语音识别：Paraformer 模型随包内置（约 82MB），只在用户首次
  # 点击语音按钮时才加载，音频全程不出手机。
  voice_recognizer: ^1.0.3
  # 检查更新：发现新版后用外部浏览器打开 APK 下载地址（不在 App 内装包）。
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
  fonts:
    # 抖音美好体（Douyin Sans Bold）。单字重，所以只在标题级使用，
    # 分级规则见 lib/ui/theme.dart 的 buildTheme(fontStyle:)。
    - family: DouyinSans
      fonts:
        - asset: assets/fonts/DouyinSans-Bold.otf
